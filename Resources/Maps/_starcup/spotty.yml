- proto: BookBase
  entities:
  - uid: 1959
    components:
    - type: Transform
      rot: 3.141592653589793 rad
      pos: 0.691448,-57.473083
      parent: 1
    - type: Paper
      content: >2-
                                      [head=2]How and Why[/head]

                                                [head=1]YOU[/head]

                           [head=2]Should Secure the Disk[/head]

                                       [bold]Authored by Mary
                                       Published by Mary[/bold]

        [head=1]Why:[/head]


        There are a multitude of reasons why one should secure the nuclear authentication disk. The baseline reason is, of course, to prevent the detonation of the nuclear fission explosive. However, there are threats that require the authentication disk. This book acts as a compendium of them and their reasons for taking the authentication disk.


        [head=2]A1. The Syndicate[/head]

        [italic]The Syndicate requires the nuclear authentication disk to commit terroristic acts on the station, killing everyone onboard.[/italic]


        [head=2]A2. Thieves[/head]

        [italic]Thieves exist, and will always exist. They simply find the disk neat, a good collectable. Can you really blame them for that thought? No, but you can blame them for acting upon it.[/italic]


        [head=2]A3. Greytide[/head]

        [italic]Passengers will want to get their grubby hands on everything they can. Some just do it to annoy respectable, hardworking crewmembers. Others may be traitors. Either way, never let a passenger have the disk.[/italic]


        [head=2]A4. Clowns[/head]

        [italic]Evil destructive forces of nature that must be obliterated on sight. Further explanation is not necessary.[/italic]


        [head=1]How:[/head]


        [head=2]B1. Survival Box[/head]

        [italic]The tried and true survival box. Everyone checks the bag, but some aren't bright enough to check containers in the bag. If you don't have a better idea, put it in your survival box.[/italic]


        [head=2]B2. Lunchbox[/head]

        [italic]While less common than a survival box, it is less known that the nuclear authentication disk can fit in a lunchbox. Enough containers and you can confuse anyone.[/italic]


        [head=2]B3. Coat Pockets[/head]

        [italic]The least commonly searched location for a nuclear authentication disk is in the coat pockets of someone. This is partially because any good captain wears their carapace. However, it may be useful to combine this with the next location.[/italic]


        [head=2]B4. Other Command[/head]

        [italic]Those who want the disk will try to kill the captain, and you are well equipped to prevent your death. Not many think it can be anywhere but on the captain. Outsmart the enemy, and you're halfway to victory.[/italic]


        [head=2]B5. Body[/head]

        [italic]Of all places the disk can be, nobody will ever think for a moment it's within the body of the captain. You don't have to do anything uncomfortable like eating it, but instead, ask the Medical department to place the disk in your ribcage. Those who want it will have to kill you AND have time to completely destroy your body, or surgically remove it.[/italic]

              [head=1]Stay vigilant, stay alive.[/head]
